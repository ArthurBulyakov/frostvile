<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" fill="none" role="img">
  <title>Знак ООО «Фроствиль»: снежинка, горы, дом и ели</title>
  <defs>
    <linearGradient id="ridge" x1="320" y1="120" x2="320" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e5f1f8"/>
      <stop offset="0.45" stop-color="#b7d0e3"/>
      <stop offset="1" stop-color="#8fb4cc"/>
    </linearGradient>
    <linearGradient id="peak" x1="430" y1="150" x2="390" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7fbfe"/>
      <stop offset="0.28" stop-color="#d5e7f3"/>
      <stop offset="0.55" stop-color="#7eabc4"/>
      <stop offset="1" stop-color="#5f90b0"/>
    </linearGradient>
    <linearGradient id="peakLeft" x1="210" y1="180" x2="180" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f8fc"/>
      <stop offset="0.34" stop-color="#c5dced"/>
      <stop offset="1" stop-color="#7fa9c4"/>
    </linearGradient>
    <linearGradient id="houseWall" x1="300" y1="300" x2="300" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8eb3cb"/>
      <stop offset="1" stop-color="#6d97b4"/>
    </linearGradient>
    <linearGradient id="pathFill" x1="120" y1="390" x2="520" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7e8f3"/>
      <stop offset="0.45" stop-color="#9fc2d8"/>
      <stop offset="1" stop-color="#7eabc4"/>
    </linearGradient>
    <g id="flake-arm" stroke="#7ea9c6" stroke-width="2.6" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-36"/>
      <line x1="0" y1="-15" x2="-9" y2="-24"/>
      <line x1="0" y1="-15" x2="9" y2="-24"/>
      <line x1="0" y1="-26" x2="-6" y2="-33"/>
      <line x1="0" y1="-26" x2="6" y2="-33"/>
    </g>
  </defs>

  <!-- halo -->
  <path d="M118 292 A 214 214 0 0 1 262 78" stroke="#8eb3cb" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M378 78 A 214 214 0 0 1 522 292" stroke="#8eb3cb" stroke-width="3.2" stroke-linecap="round"/>

  <g transform="translate(320 70)">
    <use href="#flake-arm"/>
    <use href="#flake-arm" transform="rotate(60)"/>
    <use href="#flake-arm" transform="rotate(120)"/>
    <use href="#flake-arm" transform="rotate(180)"/>
    <use href="#flake-arm" transform="rotate(240)"/>
    <use href="#flake-arm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="3.1" fill="#7ea9c6"/>
  </g>

